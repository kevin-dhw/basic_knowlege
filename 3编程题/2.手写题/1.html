<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
</head>

<body>
  <script>
    function red() {
      console.log("red");
    }
    function green() {
      console.log("green");
    }
    function yellow() {
      console.log("yellow");
    }

    const light = (time, light) => {
      return new Promise((resolve, reject) => {
        setTimeout(() => {
          light()
          resolve()
        }, time)
      })
    }

    const step = () => {
      Promise.resolve().then(() => {
        return light(2000, red)
      }).then(() => {
        return light(2000, green)
      }).then(() => {
        return light(2000, yellow)
      }).then(() => {
        step()
      })
    }
    step()
  </script>
</body>
